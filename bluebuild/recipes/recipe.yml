---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: os-image
description: Custom fedora atomic image

base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - CascadiaCode
        - Ubuntu

  - type: kargs
    kargs:
      - pcie_aspm=off
      - pcie_aspm.policy=performance
      - pcie_port_pm=off
      - nvidia_drm.modeset=1
      - nvidia_drm.fbdev=1

  - type: gschema-overrides
    include:
      - zz1-gnome.gschema.override

  - type: brew
    nofile-limits: true
    brew-analytics: false
    auto-upgrade: true
    auto-update: true

  - type: dnf
    repos:
      # Installing steam through dnf instead of flatpak because it often has
      # version incompatiblities with the system mesa and the flatpak mesa
      # This causes steam and games to render with llvmpipe
      nonfree: negativo17
    install:
      install-weak-deps: false
      packages:
        - cargo
        - gamescope
        - kernel-modules-extra
        - kitty
        - libgtop2-devel
        - lm_sensors
        - mangohud
        - neovim
        - openssl
        - rclone
        - ripgrep
        - rustup
        - steam
        - zsh
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - gnome-system-monitor
        - gnome-tour
        - malcontent-control
        - yelp

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.bitwarden.desktop
          - com.discordapp.Discord
          - com.github.tchx84.Flatseal
          - com.saivert.pwvucontrol
          - com.spotify.Client
          - com.usebottles.bottles
          - dev.qwery.AddWater
          - io.missioncenter.MissionCenter
          - net.lutris.Lutris
          - org.gnome.Boxes
          - org.gnome.Calendar
          - org.gnome.Evolution
          - org.gnome.Extensions
          - org.mozilla.firefox
          - org.openrgb.OpenRGB

  - type: gnome-extensions
    install:
      - 779 # Clipboard Indicator
      - Blur my Shell
      - Burn My Windows
      - Display Configuration Switcher
      - Just Perfection
      - Vitals
      - Quick Settings Audio Devices Hider

  - type: gnome-extensions-unverified
    source: local
    install:
      - 4928 # Media Label and Controls (Mpris Label)
      - Another Window Session Manager

  - type: chezmoi
    repository: "https://github.com/BuzzedBizz/dotfiles"

  # default-flatpaks doesn't let me change the default permissions
  # which we need for some things to work
  - type: script
    scripts:
      - openrgb-udev.sh

  # Do I really need to sign things?
  - type: signing

